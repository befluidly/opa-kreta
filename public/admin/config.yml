backend:
  name: github
  repo: befluidly/opa-kreta
  branch: main
  base_url: https://opakreta-cms-auth.gizzylynne.workers.dev

# Geen automatische AI-vertaalknop: Sveltia's optionele DeepL-integratie wordt
# hier bewust niet geconfigureerd (er is geen config-vlag om ze hard uit te
# zetten — ze activeert enkel als een editor zelf een persoonlijke DeepL-key
# invoert in de CMS-accountinstellingen; simpelweg geen key uitdelen volstaat).
i18n:
  structure: multiple_folders
  locales: [nl, en]
  default_locale: nl
  omit_default_locale_from_file_path: true

media_folder: /public/images/uploads
public_folder: /images/uploads

collections:
  # Gidsen: één collectie per submap i.p.v. één met een custom
  # path-template. Bevestigd (via een live test met echte content) dat een
  # collectie met i18n: true + structure: multiple_folders + een custom
  # path-template (bv. "{{fields.subcategory}}/{{slug}}") bestaande
  # entries niet correct inleest — het bewerkingsscherm toont dan alle
  # velden leeg (ook velden die wél overeenkomen met de frontmatter),
  # terwijl platte collecties zonder path-template (zoals Praktisch en
  # Recepten hieronder) altijd correct werkten. Dit is de fallback die het
  # oorspronkelijke plan al voorzag voor precies dit scenario.
  #
  # Elke submap-collectie hieronder heeft een gewone `folder` (geen
  # `path` nodig, want elke submap = exact één collectie) en een
  # `subcategories`-veld (meervoud, multi-select) dat overeenkomt met hoe
  # de bestaande 27 artikelen hun regio/onderwerp écht opslaan in
  # frontmatter — niet het enkelvoudige `subcategory` van de vorige versie
  # van deze config, dat met geen enkel bestaand bestand overeenkwam.
  - name: gidsen-chania
    label: "Gidsen: Chania"
    folder: /content/gidsen/chania
    extension: mdx
    i18n: true
    create: true
    fields:
      - { label: "Titel", name: title, widget: string }
      - { label: "Samenvatting", name: excerpt, widget: text }
      - { label: "Datum", name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: "Coverfoto", name: coverImage, widget: image, required: false }
      - { label: "Categorie", name: category, widget: hidden, default: gidsen }
      - label: "Regio's/onderwerpen"
        name: subcategories
        widget: select
        multiple: true
        default: [chania]
        hint: "Het artikel toont in elke geselecteerde regio/onderwerp — staat al op Chania ingesteld, voeg toe als het artikel ook elders moet tonen."
        options:
          [chania, heraklion, rethymnon, lassithi, cultuur, geschiedenis,
           eten-en-drinken, natuur-en-wandelen]
      - label: "Tags"
        name: tags
        widget: list
        required: false
      - label: "Affiliates"
        name: affiliates
        widget: list
        required: false
        fields:
          - { label: "Titel", name: title, widget: string, required: false }
          - { label: "Tekst", name: text, widget: text, required: false }
          - { label: "Link", name: link, widget: string, required: false }
          - { label: "Knoptekst", name: button, widget: string, required: false }
          - { label: "Afbeelding", name: image, widget: image, required: false }
      - label: "Inhoud"
        name: body
        widget: markdown
        default: |
          ## Intro

          ## Bezienswaardigheden

          ## Praktische info

          ## Tips

